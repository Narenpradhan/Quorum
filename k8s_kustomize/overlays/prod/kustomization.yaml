apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

labels:
  - pairs:
      environment: prod

resources:
  - ../../base

patches:
  - path: patches/replicas.yaml
  - path: patches/resources.yaml
  - target:
      kind: Ingress
      name: quorum-ingress
    path: patches/ingress.yaml
